# Slash-commands registered at startup and on /reload_commands.

commands:
  - name: help
    description: Show bot help
    handler: bot.handlers.commands.help_command
    admin_only: false

  - name: ask
    description: Ask the AI assistant
    handler: bot.handlers.commands.ask_command
    admin_only: false

  - name: top
    description: Top problems for the last 7 days
    handler: bot.handlers.commands.top_command
    admin_only: false

  - name: feedback
    description: Send feedback or suggestion
    handler: bot.handlers.commands.feedback_command
    admin_only: false

  - name: list_keywords
    description: List keyword phrases
    handler: bot.handlers.commands.list_keywords_command
    admin_only: false

  - name: list_responsible
    description: List responsible usernames
    handler: bot.handlers.commands.list_responsible_command
    admin_only: false

  - name: add_keyword
    description: Add a keyword phrase
    handler: bot.handlers.admin.add_keyword_command
    admin_only: true

  - name: remove_keyword
    description: Remove a keyword phrase
    handler: bot.handlers.admin.remove_keyword_command
    admin_only: true

  - name: add_responsible
    description: Add a responsible username
    handler: bot.handlers.admin.add_responsible_command
    admin_only: true

  - name: remove_responsible
    description: Remove a responsible username
    handler: bot.handlers.admin.remove_responsible_command
    admin_only: true

  - name: ban_user
    description: Ban a user by Telegram ID
    handler: bot.handlers.admin.ban_user_command
    admin_only: true

  - name: unban_user
    description: Unban a user by Telegram ID
    handler: bot.handlers.admin.unban_user_command
    admin_only: true

  - name: list_banned
    description: List banned users
    handler: bot.handlers.admin.list_banned_command
    admin_only: true

  - name: reload_commands
    description: Reload slash-commands without restarting
    handler: bot.handlers.admin.reload_commands_command
    admin_only: true

  - name: add_solution
    description: Add solution to knowledge base
    handler: bot.handlers.admin.add_solution_command
    admin_only: true

  - name: list_kb
    description: Show knowledge base
    handler: bot.handlers.admin.list_kb_command
    admin_only: true

  - name: delete_kb
    description: Delete knowledge base entry
    handler: bot.handlers.admin.delete_kb_command
    admin_only: true

  - name: stats_kb
    description: Knowledge base statistics
    handler: bot.handlers.admin.stats_kb_command
    admin_only: true

  - name: report_now
    description: Send daily report now (admin)
    handler: bot.handlers.admin.report_now_command
    admin_only: true
